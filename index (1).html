<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кэшбэк">
<meta name="theme-color" content="#eef0f6">
<title>Кэшбэк</title>
<style>
:root{--bg:#eef0f6;--card:#fff;--ink:#191c2b;--mute:#6b7089;--line:#dfe2ee;--acc:#3b3fe0;--onacc:#fff;--danger:#d23b3b;--soft:#e6e7fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141625;--card:#1e2135;--ink:#eceefc;--mute:#9a9fc0;--line:#2d3150;--acc:#8a8dff;--onacc:#12132a;--danger:#ff7b7b;--soft:#2a2e52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 16px;letter-spacing:-.02em}
.bank{background:var(--card);border-radius:16px;margin-bottom:10px;border:1px solid var(--line);overflow:hidden}
.head{display:block;width:100%;padding:16px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.top{display:flex;align-items:center;font-weight:600;font-size:18px}
.top .arr{margin-left:auto;color:var(--mute);transition:transform .2s}
.bank.open .arr{transform:rotate(90deg)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bank.open .pills{display:none}
.pill{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:14px}
.pill b{color:var(--acc)}
.body{display:none;padding:0 16px 16px}
.bank.open .body{display:block}
.cat{padding:10px 0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.row label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.x{background:none;border:0;color:var(--mute);font-size:22px;line-height:1;padding:4px 8px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 32px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.pct{font-weight:600;color:var(--acc)}
.add{display:flex;gap:8px;margin-top:12px}
input[type=text],input[type=number]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
input[type=text]{flex:1}input.pin{flex:none;width:72px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--onacc);cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.del{background:none;color:var(--danger);border:1px solid var(--line)}
.add .grow{flex:1}
.foot{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.foot .add{margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.dlg[hidden]{display:none}
.box{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%}
.box p{margin:0 0 4px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Кэшбэк от банков</h1>
<div id="app"></div>
<div class="foot">
  <div class="add"><input type="text" id="newBank" placeholder="Название банка"><button class="btn" data-a="addbank">Добавить банк</button></div>
  <button class="btn ghost" data-a="reset">Сбросить все категории</button>
</div>
</main>
<div class="toast" id="toast"></div>
<div class="dlg" id="dlg" hidden><div class="box"><p id="dtxt"></p><div class="add"><button class="btn ghost grow" data-a="dno">Отмена</button><button class="btn del grow" data-a="dyes">Удалить</button></div></div></div>
<script>
var KEY="cashback-v1";
var CATS=["Красота","Рестораны","Одежда","Продукты","Аптеки","Искусство","Фастфуд","Развлечения","Спорттовары","Дом и ремонт","Все покупки","Другие"];
var EMO={"Красота":"💄","Рестораны":"🍽️","Одежда":"👗","Продукты":"🛒","Аптеки":"💊","Искусство":"🎨","Фастфуд":"🍔","Развлечения":"🎡","Спорттовары":"⚽","Дом и ремонт":"🛠️","Все покупки":"🛍️","Другие":"✨"};
var PCT=[1,2,3,4,5,10];
var BANKS=["Альфа","Т-Банк","Сбер","Пэй","ВТБ"];
var state,open={},pending=null;
function mk(){return CATS.map(function(c){return{n:c,on:false,p:0}})}
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}
if(!Array.isArray(state))state=BANKS.map(function(b){return{n:b,c:mk()}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},1400)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function label(n){return /^\p{Extended_Pictographic}/u.test(n)?n:(EMO[n]||"🏷️")+" "+n}
function ask(txt,fn){pending=fn;document.getElementById("dtxt").textContent=txt;document.getElementById("dlg").hidden=false}
function render(){
  var h="";
  state.forEach(function(b,i){
    var sel=b.c.filter(function(c){return c.on});
    h+='<section class="bank'+(open[i]?" open":"")+'"><button class="head" data-a="open" data-b="'+i+'"><span class="top">'+esc(b.n)+'<span class="arr">›</span></span>';
    if(sel.length){h+='<span class="pills">'+sel.map(function(c){return'<span class="pill">'+esc(label(c.n))+' <b>'+c.p+'%</b></span>'}).join("")+'</span>'}
    h+='</button><div class="body">';
    b.c.forEach(function(c,j){
      var pcts=PCT.slice();if(c.on&&c.p&&pcts.indexOf(c.p)<0)pcts.push(c.p);
      h+='<div class="cat"><div class="row"><label><input type="checkbox" data-a="check" data-b="'+i+'" data-c="'+j+'"'+(c.on?" checked":"")+'><span>'+esc(label(c.n))+'</span></label>'+
        '<span class="pct">'+c.p+'%</span><button class="x" aria-label="Удалить категорию" data-a="delcat" data-b="'+i+'" data-c="'+j+'">×</button></div>';
      if(c.on){h+='<div class="chips">'+pcts.map(function(p){return'<button class="chip'+(c.p===p?" on":"")+'" data-a="pct" data-b="'+i+'" data-c="'+j+'" data-v="'+p+'">'+p+'%</button>'}).join("")+'</div>'}
      h+='</div>';
    });
    h+='<div class="add"><input type="text" id="cn'+i+'" placeholder="Новая категория"><input type="text" class="pin" id="cp'+i+'" placeholder="%" inputmode="decimal" autocomplete="off"><button class="btn ghost" data-a="addcat" data-b="'+i+'">Добавить</button></div>'+
      '<div class="add"><button class="btn grow" data-a="savebank" data-b="'+i+'">Сохранить категории</button><button class="btn del grow" data-a="delbank" data-b="'+i+'">Удалить банк</button></div></div></section>';
  });
  document.getElementById("app").innerHTML=h||'<p style="color:var(--mute)">Банков пока нет. Добавьте первый ниже.</p>';
}
function addCat(b){
  var ni=document.getElementById("cn"+b),pi=document.getElementById("cp"+b);
  var n=ni.value.trim(),p=parseFloat(pi.value.replace(",","."));
  if(!n)return false;
  state[b].c.push({n:n,on:!isNaN(p)&&p>0,p:(isNaN(p)||p<0)?0:p});
  return true;
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t||t.type==="checkbox")return;
  var a=t.dataset.a,b=+t.dataset.b,c=+t.dataset.c;
  if(a==="dno"){pending=null;document.getElementById("dlg").hidden=true;return}
  if(a==="dyes"){document.getElementById("dlg").hidden=true;if(pending)pending();pending=null;return}
  if(a==="open"){open[b]=!open[b];render();return}
  if(a==="pct"){state[b].c[c].p=+t.dataset.v;save();render();return}
  if(a==="delcat"){ask("Удалить категорию «"+state[b].c[c].n+"»?",function(){state[b].c.splice(c,1);save();render()});return}
  if(a==="delbank"){ask("Удалить банк «"+state[b].n+"» со всеми категориями?",function(){state.splice(b,1);open={};save();render()});return}
  if(a==="addcat"){
    if(!addCat(b)){toast("Впишите название категории");return}
    save();render();open[b]=true;render();toast("Категория добавлена");return}
  if(a==="savebank"){
    addCat(b);save();open[b]=false;render();toast("Сохранено");return}
  if(a==="addbank"){
    var i=document.getElementById("newBank"),v=i.value.trim();
    if(!v){toast("Впишите название банка");return}
    state.push({n:v,c:mk()});open[state.length-1]=true;i.value="";save();render();toast("Банк добавлен");return}
  if(a==="reset"){
    state.forEach(function(bk){bk.c.forEach(function(x){x.on=false;x.p=0})});
    save();render();toast("Все категории сброшены");return}
});
document.addEventListener("change",function(e){
  var t=e.target;if(t.dataset.a!=="check")return;
  var c=state[+t.dataset.b].c[+t.dataset.c];c.on=t.checked;c.p=t.checked?(c.p||1):0;save();render();
});
render();
</script>
</body>
</html>
