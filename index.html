<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кэшбэк">
<meta name="theme-color" content="#eef0f6">
<title>Кэшбэк</title>
<style>
:root{--bg:#eef0f6;--card:#fff;--ink:#191c2b;--mute:#6b7089;--line:#dfe2ee;--acc:#3b3fe0;--onacc:#fff;--danger:#d23b3b;--soft:#e8e9fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141625;--card:#1e2135;--ink:#eceefc;--mute:#9a9fc0;--line:#2d3150;--acc:#8a8dff;--onacc:#12132a;--danger:#ff7b7b;--soft:#2a2e52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 6px;letter-spacing:-.02em}
.sub{margin:0 0 16px;color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.bank{background:var(--card);border-radius:16px;margin-bottom:10px;border:1px solid var(--line);overflow:hidden;padding-bottom:4px}
.hrow{display:flex;align-items:center}
.xb{background:none;border:0;color:var(--mute);font-size:18px;padding:18px 8px 18px 16px}
.nm{flex:1;font-weight:600;font-size:18px;padding:16px 16px 16px 6px}
.arr{margin-left:8px;color:var(--mute);transition:transform .2s}
.bank.open .arr{transform:rotate(90deg)}
.cbw{position:relative;margin:0 16px 8px}.cbc{display:block;width:100%;text-align:left;background:var(--soft);border:0;border-radius:12px;padding:10px 12px 10px 40px}.cx{position:absolute;top:6px;left:6px;width:28px;height:28px;border:0;border-radius:50%;background:none;color:var(--mute);font-size:13px}
.cl{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.cl b{color:var(--acc)}
.tags{display:block;margin-top:4px;font-size:13px;color:var(--mute)}
.body{display:none;padding:0 16px 12px}
.bank.open .body{display:block}
.sr{display:flex;justify-content:flex-end;align-items:center;width:100%;background:none;border:0;padding:6px 16px 12px;font-size:15px;font-weight:500;color:var(--mute);text-align:left}
input[type=text]{font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.srch{margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:13px;text-align:center;word-break:break-word}
.bub[hidden]{display:none}
.bub .em{font-size:26px;line-height:1}
.bub.sel{border-color:var(--acc);background:var(--soft);font-weight:600}
.bub.addb{border-style:dashed;color:var(--acc)}
.bw{position:relative;display:flex}.bw .bub{flex:1;width:100%}.bw[hidden]{display:none}
.bx{position:absolute;top:2px;left:2px;width:28px;height:28px;border:0;border-radius:50%;background:none;color:var(--mute);font-size:12px}
.btn{font-weight:600;border:0;border-radius:12px;padding:12px 14px;background:var(--acc);color:var(--onacc)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.full{width:100%;margin-top:20px}
.add{display:flex;gap:8px;margin-top:12px}
.add .grow{flex:1}
.add input[type=text]{flex:1}
.foot{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.foot .add{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.mdl,.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;z-index:10}
.mdl{align-items:flex-end;justify-content:center}
.dlg{align-items:flex-end;justify-content:center;z-index:20}
.mdl[hidden],.dlg[hidden]{display:none}
.dlg.rev .add{flex-direction:row-reverse}
.dlg.rev #dok{background:none;border:1px solid var(--line);color:var(--ink)}
.dlg.rev #dcn{background:var(--acc);border:0;color:var(--onacc)}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet,.box{overscroll-behavior:contain;transition:transform .2s}
.sheet::before,.box::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 10px}
.hb{display:inline-flex;align-items:center;line-height:1;background:var(--soft);border:0;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--acc);margin-right:6px}
.hb.ic{display:flex;align-items:center;padding:6px 8px;margin-right:12px}
.hb svg{width:20px;height:20px;display:block}
.bd{display:inline-flex;align-items:center;line-height:0;margin-left:6px;opacity:.55}.bd svg{width:15px;height:15px;display:block}
.ydx{margin-top:14px}.ydx[hidden]{display:none}.ydx p{margin:0;font-weight:600}.ydx ul{margin:6px 0 0;padding-left:20px}
.msub{color:var(--mute);margin:0 0 4px}
.lim{background:var(--soft);border-radius:14px;margin-top:10px}
.li{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.li .lt{flex:1}
.li+.li{border-top:1px solid var(--line)}
.li b{color:var(--acc);text-align:right}
.lrow{display:flex;gap:6px;margin-top:8px;align-items:center}
#dcn[hidden]{display:none}
.lrow .lt{flex:1}
.lrow input{flex:1;min-width:0}.lrow .lchk{flex:none;width:22px}.lrow .lv{flex:.8}
.res{margin-top:16px;padding:14px;border-radius:12px;background:var(--soft);font-weight:600;opacity:.45}
.res.on{opacity:1}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mt{font-size:20px;font-weight:700}
.x{display:flex;align-items:center;justify-content:center;flex:none;padding:0;background:var(--soft);border:0;border-radius:50%;width:34px;height:34px;color:var(--mute)}
.x svg{width:16px;height:16px;display:block}
.mcat{font-size:18px;font-weight:600}
.lbl{font-weight:600;margin:16px 0 8px}
.two{display:flex;align-items:center;gap:8px;margin-top:8px}
.two input{flex:1}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.box{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.dt{margin:0;font-size:18px;font-weight:700}
.ds{margin:0 0 4px;color:var(--mute);white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:30}
.toast.show{opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Кэшбэк</h1>
<p class="sub">16% россиян пользуются кэшбэком и возвращают около 60&nbsp;000₽ в год по результатам исследования для «ТАСС»</p>
<div id="app"></div>
<div class="foot">
  <div class="add"><input type="text" id="newBank" placeholder="Название банка"><button class="btn" data-a="addbank">Добавить банк</button></div>
  <button class="btn ghost" data-a="reset">Сбросить кэшбэк</button>
</div>
</main>
<div class="mdl" id="mdl" hidden></div>
<div class="dlg" id="dlg" hidden><div class="box"><div class="mh"><span class="mt" id="dt"></span><button class="x" aria-label="Закрыть" data-a="dno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><p class="ds" id="ds"></p><div class="add"><button class="btn grow" id="dok" data-a="dyes">Удалить</button><button class="btn ghost grow" id="dcn" data-a="dno">Отмена</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
var KEY="cashback-v1";
var CATS=["Все покупки","Красота","Рестораны","Одежда","Продукты","Аптеки","Искусство","Фастфуд","Развлечения","Спорттовары","Дом и ремонт"];
var EMO={"Красота":"💄","Рестораны":"🍽️","Одежда":"👗","Продукты":"🛒","Аптеки":"💊","Искусство":"🎨","Фастфуд":"🍔","Развлечения":"🎡","Спорттовары":"⚽","Дом и ремонт":"🛠️","Все покупки":"🛍️"};
var PCT=[1,2,3,4,5,10];
var BANKS=["Альфа","Т-Банк","Сбер","Яндекс Пэй","ВТБ"];
var IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11.5V16M12 8h.01" stroke-width="2.4"/></svg>';
var XI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var CALC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><rect x="8" y="5.5" width="8" height="3.5" rx=".8"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>';
var LIM={
"Альфа":{items:[["Без подписки","5000₽"],["С «Альфа-Смарт»","7000₽"],["С Alfa Only","30\u00a0000₽"],["Карта для детей","2000₽"]]},
"Т-Банк":{items:[["Без подписки","3000₽"],["С PRO","5000₽"],["С Premium","30\u00a0000₽"],["Карта для детей","2000 бонусов"]]},
"Сбер":{items:[["Без подписки","2000 бонусов"],["С «СберПрайм»","10\u00a0000 бонусов"],["С «СберПрайм+»","15\u00a0000 бонусов"],["Карта для детей","1000 бонусов"]]},
"Яндекс Пэй":{ydx:1,items:[]},
"ВТБ":{items:[["Без подписки","3000₽"],["С «Привилегией»","30\u00a0000₽"]]}
};
var RULES=[
["аптек|медс|медиц|клиник|поликлин|врач|здоров|стомат|лекарств|фарм|анализ|лаборатор|оптик|очки","💊"],
["авиа|самол|перел[её]т|тр[еэ]вел|аэро","✈️"],
["отел|гостиниц|хостел|booking|бронирован","🏨"],
["поезд|ржд","🚆"],
["азс|заправк|бензин|топлив|лукойл|газпром|роснефть","⛽"],
["транспорт|автобус|маршрутк|троллейбус|трамвай","🚌"],
["метро","🚇"],
["такси","🚕"],
["авто|машин|парков|шиномонт|каршеринг|мойк","🚗"],
["фастфуд|бургер|макдон|kfc|вкусно","🍔"],
["пицц","🍕"],
["суши|ролл","🍣"],
["красот|салон|парикмах|космет|маникюр|барбер|(^| )спа( |$)","💄"],
["кофе|кофейн|кафе|чай|пекарн|кондитер","☕"],
["ресторан|еда|обед|ужин|бар|столов","🍽️"],
["алкогол|вино|пиво|водк","🍷"],
["одежд|обув|мода|кроссов|бельё|белье","👗"],
["продукт|супермаркет|пят[её]роч|магнит|перекр[её]ст|лент|ашан|вкусвилл|гипермаркет","🛒"],
["кино|театр|концерт|афиш|развлеч|квест|аттракц","🎬"],
["искусств|музей|выставк|галере","🎨"],
["спорт|фитнес|трен|велосип|лыж|активн|бассейн","⚽"],
["дом|ремонт|строй|мебел|икеа|леруа|сантех|дач","🛠️"],
["книг|канцел|школ|курс|образован|универ","📚"],
["животн|зоо|питом|ветеринар|корм","🐾"],
["цвет|букет","💐"],
["подар","🎁"],
["связь|мобил|билайн|мтс|мегафон|теле2|интернет|телеком","📱"],
["электрон|техник|днс|мвидео|эльдорадо|гаджет|смартфон|компьютер","💻"],
["дет|игруш","🧸"],
["игр|гейм|steam","🎮"],
["музык|подписк|стриминг|okko|кинопоиск","🎵"],
["жкх|коммунал|квартплат|электричеств","💡"],
["банк|страхов|финанс|инвест","🏦"],
["все покупки|маркетплейс|озон|ozon|wildberries|вайлдберриз|покупк","🛍️"]
].map(function(r){return[new RegExp(r[0]),r[1]]});
function pick(n){var s=n.toLowerCase();for(var i=0;i<RULES.length;i++){if(RULES[i][0].test(s))return RULES[i][1]}return"🏷️"}
function splitEmoji(n){var m=n.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*/u);return m?{e:m[1],n:n.slice(m[0].length).trim()||n}:{e:null,n:n}}
function em(c){return c.e||EMO[c.n]||pick(c.n)}
function mk(){return CATS.map(function(c){return{n:c,on:false,p:0}})}
function clr(c){c.on=false;c.p=0;c.min=null;c.max=null;c.cap=null;c.online=false;c.offline=false}
var state,open={},pending=null,M=null;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}
if(!Array.isArray(state))state=BANKS.map(function(b){return{n:b,c:mk()}});
state.forEach(function(b){b.c.forEach(function(c){if(!c.e){var s=splitEmoji(c.n);if(s.e){c.e=s.e;c.n=s.n}}})});
try{if(!localStorage.getItem(KEY+"-m2")){
  state.forEach(function(b){
    b.c=b.c.filter(function(c){return c.n!=="Другие"});
    var k=b.c.findIndex(function(c){return c.n==="Все покупки"});
    if(k>0)b.c.unshift(b.c.splice(k,1)[0]);
  });
  save();localStorage.setItem(KEY+"-m2","1");
}}catch(e){}
try{if(!localStorage.getItem(KEY+"-m3")){
  state.forEach(function(b){if(b.n==="Пэй")b.n="Яндекс Пэй"});
  save();localStorage.setItem(KEY+"-m3","1");
}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},1500)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(id){return document.getElementById(id)}
function short(v){v=String(v||"");var i=v.indexOf("₽");if(i>=0)return v.slice(0,i+1).trim();var m=v.match(/\d[\d\s\u00a0.,]*\d|\d/);return m?m[0].trim():v.trim()}
function selArr(b){return Array.isArray(b.sel)?b.sel:(b.sel?[b.sel]:[])}
function isY(b){return b.n==="Яндекс Пэй"}
function limLabel(b){
  if(isY(b))return selArr(b).length?"20\u00a0000 в мес.":"Выбрать лимит";
  var a=selArr(b).filter(function(x){return x&&x.v});
  if(!a.length)return"Выбрать лимит";
  if(a.length===1)return esc(short(a[0].v))+" в мес.";
  var t=0,rub=true,ok=true;
  a.forEach(function(x){var n=parseFloat(short(x.v).replace(/[^\d.,]/g,"").replace(",","."));if(isNaN(n))ok=false;else t+=n;if(x.v.indexOf("₽")<0)rub=false});
  return esc(ok?f(t)+(rub?"₽":""):a.map(function(x){return short(x.v)}).join(" + "))+" в мес."
}
function qn(n){return String(n).replace(/["«»“”„]/g,"").replace(/\s+/g," ").trim()||String(n)}
function fp(x){return String(x).replace(".",",")}
function f(n){n=Number(n);return n>=10000?n.toLocaleString("ru-RU"):fp(n)}
function bi(name){var l=name.toLowerCase();for(var i=0;i<CATS.length;i++){if(CATS[i].toLowerCase()===l)return i}return-1}
function insertPos(b,k){var i=0;while(i<b.c.length){var x=bi(b.c[i].n);if(x<0||x>k)break;i++}return i}
function bi2(b,n){var l=n.toLowerCase();for(var i=0;i<b.c.length;i++){if(b.c[i].n.toLowerCase()===l)return i}return-1}
function restoreBase(b){CATS.forEach(function(n,k){if(bi2(b,n)<0)b.c.splice(insertPos(b,k),0,{n:n,on:false,p:0})})}
function v(x){return x==null?"":fp(x)}
function num(id){var x=parseFloat($(id).value.replace(/\s/g,"").replace(",","."));return isNaN(x)||x<0?null:x}
function info(c){
  var a=[];
  if(c.min!=null&&c.max!=null)a.push("Покупки от "+f(c.min)+"₽ до "+f(c.max)+"₽");
  else if(c.min!=null)a.push("Покупки от "+f(c.min)+"₽");
  else if(c.max!=null)a.push("Покупки до "+f(c.max)+"₽");
  if(c.cap!=null)a.push("Макс. кэшбэк "+f(c.cap));
  if(c.online&&c.offline)a.push("Онлайн и офлайн");
  else if(c.online)a.push("Только онлайн");
  else if(c.offline)a.push("Только офлайн");
  return a;
}
function ask(t,s,fn,ok,rev){pending=fn;$("dlg").classList.toggle("rev",!!rev);$("dt").textContent=t;$("ds").textContent=s||"";$("dok").textContent=ok||"Удалить";$("dcn").hidden=false;$("dlg").hidden=false}
function notice(t,s){pending=null;$("dlg").classList.remove("rev");$("dt").textContent=t;$("ds").textContent=s;$("dok").textContent="Понятно";$("dcn").hidden=true;$("dlg").hidden=false}
function render(){
  var h="";
  state.forEach(function(b,i){
    h+='<section class="bank'+(open[i]?" open":"")+'"><div class="hrow"><button class="xb" aria-label="Удалить банк" data-a="delbank" data-b="'+i+'">✕</button><div class="nm">'+esc(b.n)+'</div><button class="hb" data-a="lim" data-b="'+i+'">'+limLabel(b)+(isY(b)&&selArr(b).length?'<span class="bd">'+IC+'</span>':'')+'</button><button class="hb ic" aria-label="Рассчитать кэшбэк" data-a="calc">'+CALC+'</button></div>';
    b.c.forEach(function(c,j){
      if(!c.on)return;
      var t=info(c).join(" • ");
      h+='<div class="cbw"><button class="cx" aria-label="Сбросить кэшбэк" data-a="unset" data-b="'+i+'" data-c="'+j+'">✕</button><button class="cbc" data-a="edit" data-b="'+i+'" data-c="'+j+'"><span class="cl"><span>'+em(c)+' '+esc(c.n)+'</span><b>'+fp(c.p)+'%</b></span>'+(t?'<span class="tags">'+t+'</span>':'')+'</button></div>';
    });
    h+='<button class="sr" data-a="open" data-b="'+i+'">Категории<span class="arr">›</span></button><div class="body"><input type="text" class="srch" data-s="'+i+'" placeholder="Поиск по названию" autocomplete="off"><div class="grid">';
    b.c.forEach(function(c,j){
      if(c.on)return;
      h+='<div class="bw" data-nm="'+esc(c.n.toLowerCase())+'"><button class="bub" data-a="edit" data-b="'+i+'" data-c="'+j+'"><span class="em">'+em(c)+'</span><span>'+esc(c.n)+'</span></button><button class="bx" aria-label="Удалить категорию" data-a="delcat" data-b="'+i+'" data-c="'+j+'">✕</button></div>';
    });
    h+='<button class="bub addb" data-a="new" data-b="'+i+'"><span class="em">➕</span><span>Добавить категорию</span></button></div></div></section>';
  });
  $("app").innerHTML=h||'<p style="color:var(--mute)">Банков пока нет<br>Добавьте первый ниже</p>';
}
function syncChips(){
  var x=parseFloat($("mp").value.replace(",","."));
  document.querySelectorAll("#mdl .chip").forEach(function(c){c.classList.toggle("on",+c.dataset.v===x)});
}
function openM(b,c){
  var o=c>=0?state[b].c[c]:{},h;
  M={b:b,c:c};
  h='<div class="sheet"><div class="mh"><span class="mt">'+(c>=0?em(o)+' '+esc(o.n):'О кэшбэке')+'</span><button class="x" aria-label="Закрыть" data-a="mclose">'+XI+'</button></div>';
  if(c<0)h+='<input type="text" id="mname" placeholder="Ввести название категории" autocomplete="off">';
  h+='<div class="lbl">Процент кэшбэка</div><div class="chips">'+PCT.map(function(p){return'<button class="chip" data-a="mpct" data-v="'+p+'">'+p+'%</button>'}).join("")+'</div>';
  h+='<input type="text" id="mp" placeholder="Ввести свой %" inputmode="decimal" autocomplete="off" style="margin-top:8px" value="'+(o.on?fp(o.p):"")+'">';
  h+='<div class="lbl">Сумма покупки</div><div class="two">от <input type="text" id="mmin" inputmode="decimal" autocomplete="off" value="'+v(o.min)+'"> до <input type="text" id="mmax" inputmode="decimal" autocomplete="off" value="'+v(o.max)+'"> ₽</div>';
  h+='<div class="lbl">Макс. кэшбэк</div><div class="two"><input type="text" id="mcap" inputmode="decimal" autocomplete="off" value="'+v(o.cap)+'"> ₽</div>';
  h+='<label class="chk"><input type="checkbox" id="mon"'+(o.online?" checked":"")+'> Покупки только онлайн</label><label class="chk"><input type="checkbox" id="moff"'+(o.offline?" checked":"")+'> Покупки только офлайн</label>';
  h+='<button class="btn full" data-a="msave">Сохранить</button>';
  $("mdl").innerHTML=h+'</div>';$("mdl").hidden=false;syncChips();
}
function sheet(t){return'<div class="sheet"><div class="mh"><span class="mt">'+t+'</span><button class="x" aria-label="Закрыть" data-a="mclose">'+XI+'</button></div>'}
function normAmt(v){
  v=String(v||"").trim();
  var m=v.match(/^(\d[\d\s\u00a0]*(?:[.,]\d+)?)\s*(?:₽|р(?:уб(?:л(?:ь|ей|я))?)?|rub|rur)\s*\.?$/i);
  if(!m)return v;
  var n=parseFloat(m[1].replace(/[\s\u00a0]/g,"").replace(",","."));
  return isNaN(n)?v:f(n)+"₽";
}
function lrow(l,v,c,fx){return'<div class="lrow"><input type="checkbox" class="lchk" aria-label="Выбрать"'+(c?" checked":"")+'>'+(fx?'<span class="lt">Без подписки</span>':'<input type="text" class="ln" placeholder="Название подписки" value="'+esc(l||"")+'">')+'<input type="text" class="lv" placeholder="Сумма лимита" value="'+esc(v||"")+'">'+(fx?'':'<button class="x" aria-label="Убрать подписку" data-a="lrm">'+XI+'</button>')+'</div>'}
function isSel(bk,l,v){return selArr(bk).some(function(x){return x.l===l&&x.v===v})}
function openLimit(b){
  var bk=state[b],L=LIM[bk.n],h=sheet("Лимит кэшбэка в «"+esc(qn(bk.n))+"»");
  if(L&&L.ydx){
    var on=selArr(bk).length>0;
    h+='<div class="lim"><label class="li"><input type="checkbox" class="lchk" id="ydxc"'+(on?" checked":"")+'><span class="lt">Есть подписка «Яндекс Плюс»</span></label></div><div class="ydx" id="ydx"'+(on?"":" hidden")+'><p>Общий лимит кэшбэка — 20\u00a0000 баллов:</p><ul><li>10\u00a0000 за покупки картой офлайн и через NFC</li><li>10\u00a0000 за покупки с помощью QR, «Сплита» и прочего</li></ul></div><button class="btn full" data-a="lchoose">Выбрать</button>';
  }
  else if(L){h+='<div class="lim">'+L.items.map(function(r,k){return'<label class="li"><input type="checkbox" class="lchk" data-i="'+k+'"'+(isSel(bk,r[0],r[1])?" checked":"")+'><span class="lt">'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></label>'}).join("")+'</div><button class="btn full" data-a="lchoose">Выбрать</button>'}
  else{
    var all=bk.lim||[],fx=all.filter(function(r){return r.l==="Без подписки"})[0],oth=all.filter(function(r){return r.l!=="Без подписки"}),fv=fx?fx.v:"";
    h+='<div id="lrows">'+lrow("Без подписки",fv,isSel(bk,"Без подписки",fv),true)+oth.map(function(r){return lrow(r.l,r.v,isSel(bk,r.l,r.v))}).join("")+'</div><button class="btn ghost full" style="margin-top:12px" data-a="ladd">Добавить подписку</button><button class="btn full" style="margin-top:12px" data-a="lchoose">Выбрать</button>';
  }
  M={b:b};$("mdl").innerHTML=h+'</div>';$("mdl").hidden=false;
}
function openCalc(){
  M={};
  $("mdl").innerHTML=sheet("Рассчитать кэшбэк")+'<input type="text" id="ca" inputmode="decimal" placeholder="Сумма покупки" autocomplete="off"><input type="text" id="cb" inputmode="decimal" placeholder="Процент кэшбэка" autocomplete="off" style="margin-top:10px"><div class="res" id="cr">Вы получите: <span id="cv">0</span>₽</div><button class="btn full" data-a="ccalc">Рассчитать</button><button class="btn ghost full" style="margin-top:10px" data-a="creset">Сбросить</button></div>';
  $("mdl").hidden=false;
}
function closeM(){$("mdl").hidden=true;$("mdl").innerHTML="";M=null}
document.addEventListener("click",function(e){
  if(e.target.id==="mdl"){closeM();return}
  if(e.target.id==="dlg"){pending=null;$("dlg").hidden=true;return}
  var t=e.target.closest("[data-a]");if(!t)return;
  var a=t.dataset.a,b=+t.dataset.b,c=+t.dataset.c;
  if(e.target.id==="dlg"){pending=null;$("dlg").hidden=true;return}
  if(a==="lim"){openLimit(b);return}
  if(a==="calc"){openCalc();return}
  if(a==="ladd"){$("lrows").insertAdjacentHTML("beforeend",lrow());return}
  if(a==="lrm"){t.closest(".lrow").remove();return}
  if(a==="lchoose"){
    var lb=state[M.b],LL=LIM[lb.n],lim=[],sel=[],bad=false;
    if(LL&&LL.ydx){sel=$("ydxc").checked?[{l:"Есть подписка «Яндекс Плюс»",v:"20\u00a0000"}]:[]}
    else if(LL){
      sel=Array.prototype.filter.call(document.querySelectorAll("#mdl .lchk"),function(x){return x.checked}).map(function(x){var r=LL.items[+x.dataset.i];return{l:r[0],v:r[1]}});
    }else{
      Array.prototype.forEach.call(document.querySelectorAll("#lrows .lrow"),function(r,k){
        var nn=r.querySelector(".ln"),o={l:nn?nn.value.trim():"Без подписки",v:normAmt(r.querySelector(".lv").value)};
        if(nn&&(!o.l||!o.v))bad=true;
        if(r.querySelector(".lchk").checked){if(!o.v)bad=true;sel=[o]}
        lim.push(o);
      });
      if(bad){notice("Невозможно сохранить","Проверьте, ввели ли вы название подписки и сумму лимита");return}
      lb.lim=lim;
    }
    lb.sel=sel;save();closeM();render();return}
  if(a==="ccalc"){
    var ca=num("ca"),cb=num("cb");
    if(ca==null||cb==null){toast("Введите сумму и процент");return}
    $("cv").textContent=f(Math.round((ca-(ca-ca*cb/100))*100)/100);$("cr").classList.add("on");return}
  if(a==="creset"){$("ca").value="";$("cb").value="";$("cv").textContent="0";$("cr").classList.remove("on");return}
  if(a==="dno"){pending=null;$("dlg").hidden=true;return}
  if(a==="dyes"){$("dlg").hidden=true;if(pending)pending();pending=null;return}
  if(a==="open"){open[b]=!open[b];render();return}
  if(a==="edit"){openM(b,c);return}
  if(a==="new"){openM(b,-1);return}
  if(a==="mclose"){closeM();return}
  if(a==="mpct"){$("mp").value=t.dataset.v;syncChips();return}
  if(a==="msave"){
    var p=parseFloat($("mp").value.replace(",","."));
    if(!(p>0)){toast("Укажите процент");return}
    var mn=num("mmin"),mx=num("mmax"),cp=num("mcap");
    if(mn!=null&&mx!=null&&mn>mx){toast("Сумма «от» больше суммы «до»");return}
    var bk=state[M.b],cat;
    if(M.c>=0){cat=bk.c[M.c]}else{
      var nm=$("mname").value.trim();
      if(!nm){toast("Введите название категории");return}
      var s=splitEmoji(nm);
      cat=bk.c.filter(function(x){return x.n.toLowerCase()===s.n.toLowerCase()})[0];
      if(!cat){
        var k=bi(s.n);
        if(k>=0){cat={n:CATS[k],on:false,p:0};bk.c.splice(insertPos(bk,k),0,cat)}
        else{cat={n:s.n,e:s.e||pick(s.n),on:false,p:0};bk.c.push(cat)}
      }
    }
    cat.on=true;cat.p=p;cat.min=mn;cat.max=mx;cat.cap=cp;cat.online=$("mon").checked;cat.offline=$("moff").checked;
    open[M.b]=true;save();closeM();render();toast("Сохранено");return}
  if(a==="unset"){clr(state[b].c[c]);save();render();return}
  if(a==="delcat"){ask("Удалить категорию?","Вы сможете вернуть ее вручную или по кнопке «Сбросить кэшбэк»",function(){state[b].c.splice(c,1);save();render()},null,true);return}
  if(a==="delbank"){ask("Удалить этот банк?",state[b].n,function(){state.splice(b,1);open={};save();render()});return}
  if(a==="addbank"){
    var i=$("newBank"),nv=i.value.trim();
    if(!nv){toast("Введите название банка");return}
    state.push({n:nv,c:mk()});open[state.length-1]=true;i.value="";save();render();toast("Банк добавлен");return}
  if(a==="reset"){
    ask("Сбросить кэшбэк?","Сбрасывайте каждый месяц, чтобы ввести актуальный кэшбэк. Добавленные вами категории сохранятся",function(){
      state.forEach(function(bk){bk.c.forEach(clr);restoreBase(bk)});save();render();toast("Кэшбэк сброшен")},"Сбросить");return}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="mp")syncChips();
  if(t.dataset&&t.dataset.s!=null){
    var q=t.value.trim().toLowerCase();
    t.closest(".bank").querySelectorAll(".bw[data-nm]").forEach(function(el){el.hidden=!(q===""||el.dataset.nm.indexOf(q)>=0)});
  }
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t.classList||!t.classList.contains("lchk"))return;
  if(t.id==="ydxc"){$("ydx").hidden=!t.checked;return}
  var L=LIM[state[M.b].n];
  if(t.checked&&!(L&&L.multi))Array.prototype.forEach.call(document.querySelectorAll("#mdl .lchk"),function(x){if(x!==t)x.checked=false});
});
(function(){
  var sh=null,y0=0,dy=0;
  document.addEventListener("touchstart",function(e){sh=e.target.closest(".sheet,.box");if(!sh)return;y0=e.touches[0].clientY;dy=0;sh.style.transition="none"},{passive:true});
  document.addEventListener("touchmove",function(e){if(!sh)return;var d=e.touches[0].clientY-y0;if(d>0&&sh.scrollTop<=0){dy=d;sh.style.transform="translateY("+d+"px)"}else if(d<=0&&dy>0){dy=0;sh.style.transform=""}},{passive:true});
  document.addEventListener("touchend",function(){if(!sh)return;var x=sh;sh=null;x.style.transition="";x.style.transform="";if(dy>110){if(x.closest("#dlg")){pending=null;$("dlg").hidden=true}else closeM()}dy=0});
})();
render();
</script>
</body>
</html>
